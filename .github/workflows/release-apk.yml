# Build APK Android (arm64) otomatis setiap ada push ke branch main,
# lalu terbitkan sebagai GitHub Release supaya siapa pun bisa mengunduhnya.
#
# Butuh 4 secret repo (Settings → Secrets and variables → Actions), lihat README bagian "Rilis otomatis":
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch: # bisa juga dijalankan manual dari tab Actions

# Kalau ada push baru saat build masih jalan, build lama dibatalkan.
concurrency:
  group: release-apk
  cancel-in-progress: true

permissions:
  contents: write # untuk membuat tag & release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      # Nomor versi naik otomatis tiap build: 1.0.1, 1.0.2, ...
      APP_VERSION: 1.0.${{ github.run_number }}
      APP_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Cek secret keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ] || [ -z "$ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Secret keystore belum lengkap. Ikuti README bagian 'Rilis otomatis' untuk menambahkannya."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependensi
        run: npm ci

      - name: Generate project Android (Expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Build APK release (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Tandatangani APK dengan keystore tetap
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "KidsWorksheet-$APP_VERSION.apk" \
            android/app/build/outputs/apk/release/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "KidsWorksheet-$APP_VERSION.apk" | head -3
          rm -f "$RUNNER_TEMP/release.jks"
          ls -lh "KidsWorksheet-$APP_VERSION.apk"

      - name: Terbitkan GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Kids Worksheet ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          files: KidsWorksheet-${{ env.APP_VERSION }}.apk
          make_latest: true
          body: |
            APK Android (arm64) dibuat otomatis dari commit ${{ github.sha }}.

            **Cara pasang:** unduh `KidsWorksheet-${{ env.APP_VERSION }}.apk` di HP Android,
            buka filenya, lalu izinkan "pasang aplikasi dari sumber tidak dikenal" kalau diminta.
          generate_release_notes: true
